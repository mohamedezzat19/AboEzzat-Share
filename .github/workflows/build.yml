name: Build AboEzzat Cast APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AboEzzat-Cast-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Detect signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ABOEZZAT_SHARE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ABOEZZAT_SHARE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ABOEZZAT_SHARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ABOEZZAT_SHARE_KEY_ALIAS_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS_SECRET" || -z "$KEY_PASSWORD" ]]; then
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::One or more AboEzzat Cast signing secrets are missing. Debug APK only."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/classic-release-keystore.jks"
          # GitHub secret may contain copied spaces/newlines; remove whitespace from Base64 only.
          KEYSTORE_BASE64_CLEAN="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [[ -z "$KEYSTORE_BASE64_CLEAN" ]] || ! printf '%s' "$KEYSTORE_BASE64_CLEAN" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::The keystore Base64 secret could not be decoded. Re-copy the original keystore as Base64 without extra text."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS_SECRET" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed: check the keystore file, store password, and exact key alias."
            exit 1
          fi
          if ! keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS_SECRET" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/signing-check.cer" >/dev/null 2>&1; then
            echo "::error::Key validation failed: check the key password for the selected alias."
            exit 1
          fi
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "HAS_SIGNING=true" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/classic-release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ABOEZZAT_SHARE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ABOEZZAT_SHARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ABOEZZAT_SHARE_KEY_ALIAS_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed Classic APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.aboezzat.share.legacy'"
          echo "$BADGING" | grep -q "versionCode='${GITHUB_RUN_NUMBER}'"

      - name: Upload Signed Release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: AboEzzat-Cast-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Signed APK Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: classic-build-${{ github.run_number }}
          name: AboEzzat Cast build ${{ github.run_number }}
          body: "versionCode: ${{ github.run_number }}\nSigned AboEzzat Cast APK for in-app updates."
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
